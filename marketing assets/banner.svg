<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0a0f"/>
            <stop offset="100%" stop-color="#111118"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
        </radialGradient>
        <filter id="blur">
            <feGaussianBlur stdDeviation="60"/>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="630" fill="url(#bg-grad)"/>
    
    <!-- Glow -->
    <circle cx="600" cy="315" r="400" fill="url(#glow)" filter="url(#blur)"/>
    
    <!-- Logo -->
    <g transform="translate(600, 240) scale(4) translate(-12, -12)">
        <path stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
        <path stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
        <path stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14"/>
        <path stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M12 9h4"/>
        <path stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" d="M12 14h-4"/>
    </g>

    <!-- Text -->
    <text x="600" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="-1">The Brain AIOS</text>
    <text x="600" y="500" font-family="monospace, sans-serif" font-size="24" font-weight="normal" fill="#22d3ee" text-anchor="middle" letter-spacing="4">INTELLIGENCE BUILT ON STRUCTURE</text>
</svg>
