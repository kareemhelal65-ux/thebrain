<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="recall-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0e0ab" />
      <stop offset="50%" stop-color="#ffac2e" />
      <stop offset="100%" stop-color="#a52d25" />
