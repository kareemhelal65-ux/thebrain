<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" style="background: #000000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Shadow Filters for 3D Depth -->
    <filter id="dock-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="active-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.88  0 0 0 0 0.67  0 0 0 1 0" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="badge-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a52d25" flood-opacity="0.4" />
    </filter>

    <!-- Core Animated Mercury Gradient (from logo.svg) -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0e0ab" />
      <stop offset="50%" stop-color="#ffac2e" />
      <stop offset="100%" stop-color="#a52d25" />
      <animateTransform 
        attributeName="gradientTransform" 
        type="rotate" 
        from="0 0.5 0.5" 
        to="360 0.5 0.5" 
        dur="6s" 
        repeatCount="indefinite" />
    </linearGradient>

    <!-- Glass Dock Background Gradients -->
    <linearGradient id="dock-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(24, 24, 24, 0.85)" />
      <stop offset="100%" stop-color="rgba(18, 18, 20, 0.7)" />
    </linearGradient>

    <linearGradient id="dock-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <!-- Glass Icon Sheen -->
    <linearGradient id="icon-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Dock Outer Wrapper (Frosted Carbon Glass Container) -->
  <g filter="url(#dock-shadow)">
    <!-- Main Capsule shape -->
    <rect x="70" y="55" width="660" height="85" rx="28" ry="28" fill="url(#dock-bg)" stroke="url(#dock-border)" stroke-width="1.2" />
    
    <!-- Top-aligned Mercury Flow Accent Line -->
    <path d="M 98,55 L 702,55" stroke="url(#logo-grad)" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- DOCK ITEMS GROUP -->
  <g transform="translate(85, 68)">
    
    <!-- Item 1: BRAIN aOS (Brand app tile using exact logo.svg paths) -->
    <g transform="translate(0, 0)" filter="url(#icon-shadow)" cursor="pointer">
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="#181818" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <path d="M 2,1.2 L 46,1.2" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
      
      <!-- Nested SVG for exact logo paths -->
      <svg viewBox="0 0 24 24" x="9" y="9" width="30" height="30" fill="none">
        <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" stroke="url(#logo-grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" stroke="url(#logo-grad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>

      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="url(#icon-shine)" pointer-events="none" />
    </g>

    <!-- Item 2: Goals (Carbon + Gradient stroke) -->
    <g transform="translate(60, 0)" filter="url(#icon-shadow)" cursor="pointer">
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="#181818" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <path d="M 2,1.2 L 46,1.2" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
      <!-- Target Icon -->
      <circle cx="24" cy="24" r="10" stroke="url(#logo-grad)" stroke-width="1.8" fill="none" />
      <circle cx="24" cy="24" r="6" stroke="url(#logo-grad)" stroke-width="1.4" fill="none" />
      <circle cx="24" cy="24" r="2" fill="url(#logo-grad)" />
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="url(#icon-shine)" pointer-events="none" />
    </g>

    <!-- Item 3: Boardroom (Carbon + Gradient stroke) -->
    <g transform="translate(120, 0)" filter="url(#icon-shadow)" cursor="pointer">
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="#181818" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <path d="M 2,1.2 L 46,1.2" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
      <!-- Boardroom presentation Icon -->
      <rect x="15" y="16" width="18" height="12" rx="1.5" stroke="url(#logo-grad)" stroke-width="1.8" fill="none" />
      <line x1="18" y1="28" x2="16" y2="33" stroke="url(#logo-grad)" stroke-width="1.8" stroke-linecap="round" />
      <line x1="30" y1="28" x2="32" y2="33" stroke="url(#logo-grad)" stroke-width="1.8" stroke-linecap="round" />
      <line x1="24" y1="28" x2="24" y2="33" stroke="url(#logo-grad)" stroke-width="1.8" stroke-linecap="round" />
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="url(#icon-shine)" pointer-events="none" />
      <!-- Active indicator dot below boardroom -->
      <circle cx="24" cy="58" r="2" fill="#a0e0ab" filter="url(#active-glow)" />
    </g>

    <!-- Item 4: Task Board (Carbon + Gradient stroke) -->
    <g transform="translate(180, 0)" filter="url(#icon-shadow)" cursor="pointer">
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="#181818" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <path d="M 2,1.2 L 46,1.2" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
      <!-- Task board Icon -->
      <rect x="15" y="14" width="18" height="20" rx="2" stroke="url(#logo-grad)" stroke-width="1.8" fill="none" />
      <line x1="19" y1="20" x2="29" y2="20" stroke="url(#logo-grad)" stroke-width="1.6" stroke-linecap="round" />
      <line x1="19" y1="25" x2="25" y2="25" stroke="url(#logo-grad)" stroke-width="1.6" stroke-linecap="round" />
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="url(#icon-shine)" pointer-events="none" />
      <!-- Badge Notification in Mercury Red -->
      <g filter="url(#badge-shadow)">
        <circle cx="44" cy="4" r="9" fill="#a52d25" stroke="rgba(255, 255, 255, 0.15)" stroke-width="0.8" />
        <text x="44" y="7" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle">5</text>
      </g>
    </g>

    <!-- Vertical Separator Line -->
    <g transform="translate(244, 0)">
      <line x1="0" y1="10" x2="0" y2="38" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
    </g>

    <!-- Item 5: Finance Dept (Carbon + Gradient stroke) -->
    <g transform="translate(260, 0)" filter="url(#icon-shadow)" cursor="pointer">
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="#181818" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <path d="M 2,1.2 L 46,1.2" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
      <!-- Dollar Sign -->
      <text x="24" y="32" fill="url(#logo-grad)" font-size="22" font-weight="700" text-anchor="middle">S</text>
      <line x1="24" y1="12" x2="24" y2="36" stroke="url(#logo-grad)" stroke-width="2" />
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="url(#icon-shine)" pointer-events="none" />
    </g>

    <!-- Item 6: Marketing Dept (Carbon + Gradient stroke) -->
    <g transform="translate(320, 0)" filter="url(#icon-shadow)" cursor="pointer">
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="#181818" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <path d="M 2,1.2 L 46,1.2" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
      <!-- Megaphone Icon -->
      <path d="M16 22 L22 17 L29 17 L30 31 L22 31 L16 26 Z" stroke="url(#logo-grad)" stroke-width="1.8" fill="none" stroke-linejoin="round" />
      <path d="M16 22 C14.5 22 13.5 23 13.5 24 C13.5 25 14.5 26 16 26" stroke="url(#logo-grad)" stroke-width="1.8" fill="none" />
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="url(#icon-shine)" pointer-events="none" />
    </g>

    <!-- Item 7: Sales Dept (Carbon + Gradient stroke) -->
    <g transform="translate(380, 0)" filter="url(#icon-shadow)" cursor="pointer">
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="#181818" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <path d="M 2,1.2 L 46,1.2" stroke="rgba(255,255,255,0.25)" stroke-width="0.8" />
      <!-- Trending Up Icon -->
      <polyline points="14 30 22 22 27 27 34 16" stroke="url(#logo-grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <polyline points="29 16 34 16 34 21" stroke="url(#logo-grad)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="0" y="0" width="48" height="48" rx="11" ry="11" fill="url(#icon-shine)" pointer-events="none" />
    </g>

  </g>

  <!-- Floating Branded Label above dock (Simulated Tooltip) -->
  <g transform="translate(110, 15)">
    <rect x="-4" y="-3" width="76" height="24" rx="6" fill="#181818" stroke="rgba(255,255,255,0.15)" stroke-width="0.8" opacity="0.9" />
    <text x="34" y="13" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.05em">BRAIN aOS</text>
  </g>
</svg>
